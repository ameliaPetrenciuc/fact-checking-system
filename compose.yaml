services:
  ml-server:
    build:
      context: ./ml_server
      dockerfile: Dockerfile

    container_name: fact-check-ml-server

    ports:
      - "8000:8000"

    environment:
      HF_HOME: /models/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_VERBOSITY: "info"

    volumes:
      - huggingface_cache:/models/huggingface

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30m

    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2026.05.0}
    container_name: fact-check-neo4j

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_db_format: aligned

      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m

    volumes:
      - neo4j_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "password=\"$${NEO4J_AUTH#*/}\"; cypher-shell -u neo4j -p \"$$password\" \"RETURN 1\" || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: fact-check-frontend

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

    restart: unless-stopped

volumes:
  huggingface_cache:

  neo4j_data:
    external: true
    name: ${NEO4J_DATA_VOLUME:-factcheck_neo4j_main}